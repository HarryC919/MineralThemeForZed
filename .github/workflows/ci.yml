name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Build is deterministic and up to date
        run: git diff --exit-code -- themes/
      - name: Package extension bundle
        id: package
        run: |
          VERSION=$(grep -m1 '^version' extension.toml | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          zip -r "mineral-theme-zed-${VERSION}.zip" extension.toml themes LICENSE.txt README.md README_zh.md
      - name: Upload bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: mineral-theme-zed-${{ steps.package.outputs.version }}
          path: mineral-theme-zed-*.zip
          if-no-files-found: error
